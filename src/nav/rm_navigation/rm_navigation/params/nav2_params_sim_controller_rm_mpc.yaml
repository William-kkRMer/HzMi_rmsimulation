controller_server:
  ros__parameters:
    use_sim_time: True
    # ★ 2026-09-26：20.0 → 30.0 —— MPPI 的硬约束：model_dt 必须 == 1/controller_frequency
    #   （见下方 FollowPath.model_dt）。RPP/DWB/TEB 用 20.0 时没有这个约束。
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    # ★ 2026-09-26：0.5 → 0.001 —— RPP 不产生 vy 所以 0.5 无害；MPPI(Omni) 会产生，
    #   而 nav2_controller 的 getThresholdedTwist() 会把 |vy| < 阈值的**里程计反馈**抹成 0
    #   ⇒ 侧移反馈恒 0（车表现为"只会前后 + 转向"）。
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    # ★ 2026-10-05：SimpleGoalChecker → PositionGoalChecker —— 全向车（mecanum）**没有"车头"概念**
    #   ⇒ 终点只约束位置；这同时消除了"位置到了但朝向过不了 → progress checker 判失败 → 反复恢复 → ABORT"这一失败模式。
    #   键名已核实（已装 nav2 1.1.20）：该插件只声明 xy_goal_tolerance / stateful
    #   （share/nav2_controller/plugins.xml + libposition_goal_checker.so 的编译期字面量）；
    #   yaw_goal_tolerance / path_length_tolerance 在 1.1.20 的 PositionGoalChecker 里**不存在** ⇒ 删掉/不写（写了是静默失效）。
    # ★ 2026-10-31：PositionGoalChecker（1.1.20）实测把**任何**目标都判成"到达"
    #   （目标 (1.5,0) 距车 1.5 m、容差 0.25，仍 0.03 s 内 Reached）⇒ 换成成熟实现
    #   SimpleGoalChecker（nav2 默认，xy/yaw 双容差，stateful=False 不锁存）。
    # ★ 2026-10-31：nav2 自带的 PositionGoalChecker/SimpleGoalChecker 都会**瞬间到达**
    #   （根因：controller_server::isGoalReached 丢弃 transformPose 的返回值 ⇒ goal 退化成 (0,0)）。
    #   换成自研插件 rm_goal_checker::PlanGoalChecker：直接取 /plan 末点当目标，
    #   并用 tf2::TimePointZero（最新变换）比较 ⇒ 不受时间戳问题影响。
    general_goal_checker:
      stateful: False
      plugin: "rm_goal_checker::PlanGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15      # 哨兵允许倒着到点：朝向不作为硬条件（3.15 rad ≈ 180°）
    
    # 局部规划器变体：MPPI（nav:=mppi，A/B 对照专用）
    #   本文件 = nav2_params_sim_rpp.yaml 的副本，**除 controller_server 段外逐字节相同**
    #   （diff -u 只有 2 个 hunk，全部落在 controller_server 内）⇒ A/B 是单变量。
    #   键只写 nav2 **1.1.20** 真正声明的（三重核实，方法同 §H 的 Smac2D）：
    #     ① strings /opt/ros/humble/lib/libmppi_controller.so 与 libmppi_critics.so 的编译期字面量；
    #     ② third_party/nav2/nav2_mppi_controller/src/{optimizer,controller,path_handler,
    #        noise_generator,trajectory_visualizer,critic_manager}.cpp + src/critics/*.cpp 的 getParam；
    #     ③ /opt/ros/humble/share/nav2_mppi_controller/{mppic.xml,critics.xml} 的插件类名。
    # ★ 2026-11-06：自研走廊约束 MPC（rm_mpc_controller/MpcController）
    #   与 MPPI 同一个 controller_server 槽位，A/B 只需 nav:=rm_mpc / nav:=mppi。
    #   参考=全局路径按弧长推进；走廊=参考点 ±corridor_half_width 的方形（软约束）。
    FollowPath:
      plugin: "rm_mpc_controller/MpcController"
      dt: 0.05
      horizon: 20
      vmax: 2.0
      amax: 20.0   # 运动学底盘：放宽加速度限制（原来是 4，命令被卡在 amax*dt）
      w_pos: 80.0
      w_vel: 20.0
      w_u: 4.0
      w_slack: 2000.0
      v_ref: 1.0
      corridor_half_width: 0.35
      k_theta: 1.5
      wmax: 6.0
      transform_tolerance: 2.0
