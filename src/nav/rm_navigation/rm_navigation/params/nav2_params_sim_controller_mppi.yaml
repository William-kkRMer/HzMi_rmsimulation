controller_server:
  ros__parameters:
    use_sim_time: True
    # ★ 2026-09-26：20.0 → 30.0 —— MPPI 的硬约束：model_dt 必须 == 1/controller_frequency
    #   （见下方 FollowPath.model_dt）。RPP/DWB/TEB 用 20.0 时没有这个约束。
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    # ★ 2026-09-26：0.5 → 0.001 —— RPP 不产生 vy 所以 0.5 无害；MPPI(Omni) 会产生，
    #   而 nav2_controller 的 getThresholdedTwist() 会把 |vy| < 阈值的**里程计反馈**抹成 0
    #   ⇒ 侧移反馈恒 0（车表现为"只会前后 + 转向"）。
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    # ★ 2026-10-05：SimpleGoalChecker → PositionGoalChecker —— 全向车（mecanum）**没有"车头"概念**
    #   ⇒ 终点只约束位置；这同时消除了"位置到了但朝向过不了 → progress checker 判失败 → 反复恢复 → ABORT"这一失败模式。
    #   键名已核实（已装 nav2 1.1.20）：该插件只声明 xy_goal_tolerance / stateful
    #   （share/nav2_controller/plugins.xml + libposition_goal_checker.so 的编译期字面量）；
    #   yaw_goal_tolerance / path_length_tolerance 在 1.1.20 的 PositionGoalChecker 里**不存在** ⇒ 删掉/不写（写了是静默失效）。
    # ★ 2026-10-31：PositionGoalChecker（1.1.20）实测把**任何**目标都判成"到达"
    #   （目标 (1.5,0) 距车 1.5 m、容差 0.25，仍 0.03 s 内 Reached）⇒ 换成成熟实现
    #   SimpleGoalChecker（nav2 默认，xy/yaw 双容差，stateful=False 不锁存）。
    # ★ 2026-10-31：nav2 自带的 PositionGoalChecker/SimpleGoalChecker 都会**瞬间到达**
    #   （根因：controller_server::isGoalReached 丢弃 transformPose 的返回值 ⇒ goal 退化成 (0,0)）。
    #   换成自研插件 rm_goal_checker::PlanGoalChecker：直接取 /plan 末点当目标，
    #   并用 tf2::TimePointZero（最新变换）比较 ⇒ 不受时间戳问题影响。
    general_goal_checker:
      stateful: False
      plugin: "rm_goal_checker::PlanGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15      # 哨兵允许倒着到点：朝向不作为硬条件（3.15 rad ≈ 180°）
    
    # 局部规划器变体：MPPI（nav:=mppi，A/B 对照专用）
    #   本文件 = nav2_params_sim_rpp.yaml 的副本，**除 controller_server 段外逐字节相同**
    #   （diff -u 只有 2 个 hunk，全部落在 controller_server 内）⇒ A/B 是单变量。
    #   键只写 nav2 **1.1.20** 真正声明的（三重核实，方法同 §H 的 Smac2D）：
    #     ① strings /opt/ros/humble/lib/libmppi_controller.so 与 libmppi_critics.so 的编译期字面量；
    #     ② third_party/nav2/nav2_mppi_controller/src/{optimizer,controller,path_handler,
    #        noise_generator,trajectory_visualizer,critic_manager}.cpp + src/critics/*.cpp 的 getParam；
    #     ③ /opt/ros/humble/share/nav2_mppi_controller/{mppic.xml,critics.xml} 的插件类名。
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"   # mppic.xml: nav2_mppi_controller::MPPIController
      # mecanum ⇒ Omni（与 amcl 的 OmniMotionModel 一致）；optimizer.cpp:406-420 只认 DiffDrive/Omni/Ackermann
      motion_model: "Omni"
      # 时域 = time_steps × model_dt = 60 × 1/30 = 2.0 s
      time_steps: 60
      # ⚠️ 硬约束：optimizer.cpp:95-113 要求 1/controller_frequency == model_dt（eps = 1e-6），
      #   否则 throw "Controller period more then model dt" ⇒ controller_server configure 失败、整栈起不来。
      #   1/30 = 0.0333333… 与 0.0333333 之差 ≈ 3.2e-8 ≪ 1e-6 ⇒ 走"相等"分支（shift_control_sequence=ON），不抛。
      #   ⚠️ 改 controller_frequency 必须同步改这里（反之亦然）。
      model_dt: 0.0333333
      batch_size: 1500       # 1500 × 60 = 9e4 采样/周期 @30 Hz：sim 里 CPU 开销大，掉帧就把这个调小
      temperature: 0.25
      gamma: 0.008
      # 速度：按参考队实车配置的数量级，但我们的 velocity_smoother.max_velocity = [2.0, 2.0, 3.0]
      #   ⇒ 实际可用上限被它夹在 2.0 m/s / 3.0 rad/s（这里的 2.5 只是 MPPI 自己的约束）。
      #   vx_min = -vx_max ⇒ 允许全速倒车（sim 里危险，A/B 时留意）。
      # ★ 2026-11-03：2.5 → 0.8。实测 `[ERROR] Optimizer fail to compute path`（一帧里**所有**
      #   采样轨迹都判碰撞 ⇒ 无有效控制 ⇒ FollowPath abort）。算账：vx 2.5 m/s × 2 s 视野
      #   （60 × 0.0333）= **5 m** 的采样轨迹，在 0.80 m 走廊里几乎每条都撞 ⇒ 失败。
      #   0.8 m/s × 2 s = 1.6 m，采样能落在走廊内。回退：2.5。
      vx_max: 0.8
      vx_min: -2.5
      vy_max: 0.8            # 同上：2.5 → 0.8（全向平移同样会撞）
      wz_max: 1.5            # 同上：2.5 → 1.5（转速高时一个视野内扫过大角度，采样也全撞）
      prune_distance: 1.7
      # ★ 2026-11-01：0.1 → 1.5。实测（用户 nav 运行）controller 每周期报
      #   「Transform data too old when converting from map to odom_level:
      #     Data time 12.8, Transform time 10.75」⇒ gicp 发的 map→odom 落后 ~2 s
      #   ⇒ 0.1 s 的容差永远等不到 ⇒ getRobotPose 失败 ⇒ **一个 cmd_vel 都不发** ⇒ 车不动。
      #   放大到 1.5 s 让它接受较旧的变换（2D 场景下 2 s 的位姿滞后可接受）。
      transform_tolerance: 3.0
      visualize: false
      reset_period: 1.0
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # critic 的启用只由这份列表决定（critic_manager.cpp:39 与 :50-59）；类名取自
      # /opt/ros/humble/share/nav2_mppi_controller/critics.xml（= mppi::critics::<名字>）
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "PathAlignCritic", "PathFollowCritic", "ObstaclesCritic"]
      # 每个 critic 自己的参数都在 `FollowPath.<CriticName>.*` 命名空间下
      # （critic_function.hpp:81 声明 enabled；各 critic 的 getParam 以 name_ 为前缀）
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      CostCritic:
        enabled: true
        # ★ 2026-11-03：10.0 → **20.0**。现场：`gravity:=lio` 之后整体好很多，但车"喜欢贴着膨胀
        #   半径走"、偶尔蹭到障碍。原因：局部膨胀只有 0.24（=0.22+2 cm 余量）⇒ 0.22~0.24 这条
        #   2 cm 的软带是**唯一的警告信号**，10 的权重压不住 PathFollow(8)/PathAlign(10) 的
        #   "贴路径"倾向 ⇒ 规划出的轨迹就贴着 253 走。20 让软带里的代价权重翻倍。
        #   配合局部 cost_scaling 5→10（梯度更陡），把车往通道中心推；两者都**不改变**
        #   "离墙 >0.24 即零代价"的通道宽度，所以 0.8 m 走廊仍然过得去。
        #   回退：10.0。
        # ★ 2026-11-03 第二轮：20.0 → **30.0**（用户要"更不敢进障碍物"）。
        #   源码（third_party/nav2/nav2_mppi_controller/src/critics/cost_critic.cpp:167-174）：
        #     repulsive_cost += pose_cost（每个轨迹点的**格子代价**求和）
        #     total += (weight * repulsive_cost / traj_len) ^ power
        #   ⇒ weight 是**线性放大**这个斥力项 ⇒ 30 比 20 更怕 1.5 倍。
        cost_weight: 30.0
        critical_cost: 253.0      # ⚠️ 语义 = **惩罚幅度**（默认 300.0），不是"触发阈值"；
                                  #   "只有 inscribed 以上才罚"是源码硬编码（cost_critic.cpp:165）
        # ⚠️ 必须 false：cost_critic.cpp:56-65 判 costmap_ros_->getUseRadius() == consider_footprint_，
        #   我们**没有 footprint 多边形**（只有 robot_radius）⇒ use_radius_ = true
        #   ⇒ 写 true 即 true == true ⇒ configure 阶段 throw、控制器起不来。（ObstaclesCritic 有同一检查）
        consider_footprint: false
        collision_cost: 1000000.0
        # ★ 2026-11-03：1.0 → **0.3**。源码 cost_critic.cpp:171：
        #     `else if (!near_goal) repulsive_cost += pose_cost;`
        #   ⇒ 在离目标 `near_goal_distance` 以内，**膨胀斥力被整段跳过**（只做碰撞检查）。
        #   这就是"到了目标附近开始贴边/蹭障碍"的机制性原因。收到 0.3 后，只有最后 30 cm 免罚。
        near_goal_distance: 0.3
      GoalCritic:
        enabled: true
        cost_weight: 8.0           # 25.0→8.0：别让"冲向目标"压过路径跟踪/膨胀
        threshold_to_consider: 4.0
      PathAlignCritic:
        enabled: true
        cost_weight: 10.0
        threshold_to_consider: 1.5
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        trajectory_point_step: 4
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_weight: 8.0           # 5.0→8.0：贴路径走，不抄近道
        threshold_to_consider: 1.5
        offset_from_furthest: 5
      ObstaclesCritic:
        enabled: true
        cost_weight: 3.0
        consider_footprint: false   # 同 CostCritic：obstacles_critic.cpp:46-55 是同一个检查
        collision_cost: 1000000.0
        # ★ 2026-11-03：2.5 → **回 1.5**（用户要求）。ObstaclesCritic 是独立于 CostCritic 的
        #   第二条斥力（按"轨迹点离最近障碍的距离"、用膨胀半径归一化，见 obstacles_critic.cpp）。
        #   "怕不怕"主要交给 CostCritic.cost_weight(30) + 局部膨胀(scaling 1.0 / radius 0.35)；
        #   这条保持默认 1.5 即可。回退/加码：1.5 ↔ 2.5。
        repulsion_weight: 1.5
        # ⚠️ 参考配置里的 ObstaclesCritic.critical_cost 与 throw_on_min_obstacle 已按"不写死键"规则剔除：
        #   · throw_on_min_obstacle：整个 1.1.20（源码 getParam + 已装 so 字节）**grep 命中 0**，彻底不存在；
        #   · critical_cost：这个键名存在，但**只有 cost_critic.cpp 声明它** ⇒ 写在 ObstaclesCritic 命名空间下
        #     没有任何代码读（= 静默失效）。ObstaclesCritic 真正的"关键惩罚"旋钮是
        #     critical_weight（默认 20.0，本次未写 = 取默认）。
        #   同理未写 CostCritic.trajectory_point_step（只有 path_align_critic 读它）。
      # 回退：launch 用默认 nav:=rpp 即回到已验证的 RPP 路径（本文件不被读取）。

local_costmap:
  local_costmap:
    ros__parameters:
      # ★ 2026-09-24 记录：曾把这里放大到 1000.0 想绕过上游 isGoalReached() 丢弃 transformPose 失败的问题 ——
      #   「已撤销」。原因：这个值经 nav2_util::getCurrentPose() 传成了 tf2 的「等待超时」；遇到
      #   「过去的时间点」这种永远等不来的查询，会让 costmap 线程一次阻塞到超时（1000 秒），小病治成大病。
      #   真正要修的是 costmap 的 tf 摄入（见 docs/issues_and_findings.md 的 2026-09-24 条目）。
      #   ★ 2026-10-31：0.3 → **2.0**。依据（tf2_monitor 实测，本机仿真）：
      #     map→odom 的 Net delay **avg=0.34 s / max=1.79 s**（仿真跑在 ~50% 实时，gicp 的
      #     时间戳落后消费端的 now）⇒ 0.3 s 容差必然判 "Transform data too old"，
      #     而 nav2_controller::isGoalReached() 会因此把 goal 退化成 (0,0)。
      #     2.0 覆盖实测最大延迟；与 09-24 撤销的 1000.0（=1e3 s 的 tf 超时）不是同一量级。
      transform_tolerance: 2.0
